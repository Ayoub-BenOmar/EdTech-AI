services:
  db:
    image: pgvector/pgvector:pg18
    container_name: edtech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edtech_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d edtech_ai" ]
      interval: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    container_name: edtech-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Chainguard minio-client has no shell and runs as nonroot.
  # We use the MC_HOST_<alias> env var so mc never needs to write a config file.
  # Format: MC_HOST_<alias>=http://USER:PASSWORD@HOST:PORT
  minio-init:
    image: cgr.dev/chainguard/minio-client
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: mc
    command: mb --ignore-existing local/documents
    restart: on-failure

  redis:
    image: redis:7-alpine
    container_name: edtech-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    container_name: edtech-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI to read test emails

volumes:
  postgres_data:
  minio_data:
